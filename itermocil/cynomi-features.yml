windows:
  - name: Cynomi Features
    root: ~/Projects
    layout: 3_columns
    panes:
      # Row 1
      - commands:
        - cd backend
        - npm run start:dev
        name: backend
      - commands:
        - cd questionnaires
        - npm run start:dev
        name: questionnaires
      - commands:
        - cd compliance
        - npm run start:dev
        name: compliance
      # Row 2
